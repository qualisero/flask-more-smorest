repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (poetry, autofix)
        entry: poetry run ruff format flask_more_smorest tests
        language: system
        types: [python]

      - id: ruff-lint
        name: ruff lint (poetry, autofix)
        entry: poetry run ruff check --fix flask_more_smorest tests
        language: system
        types: [python]

      - id: pyright
        name: pyright (poetry)
        entry: poetry run pyright
        language: system
        pass_filenames: false
