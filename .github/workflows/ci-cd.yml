name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI (manual trigger)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing, or one transient network error installing Poetry,
      # should not cancel the other versions' results.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: "2.4.1"
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    
    - name: Install project
      run: poetry install --no-interaction
    
    - name: Run tests
      run: |
        poetry run pytest --cov=flask_more_smorest --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: "2.4.1"
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Run linting
      run: |
        poetry run ruff format --check flask_more_smorest tests
        poetry run ruff check flask_more_smorest tests
        poetry run pyright

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: "2.4.1"
    
    - name: Build package
      run: poetry build
    
    - name: Store build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: dist
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    
    # Use environment for added protection and to enable PyPI Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/flask-more-smorest
    
    # Required for PyPI Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist/
    
    - name: Publish to PyPI (Trusted Publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Trusted Publishing via OIDC - no token needed if configured on PyPI
        # If OIDC is not configured on PyPI, you must provide an API token via the "password" input
        verbose: true
        print-hash: true

  trigger-docs:
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'release'
    
    steps:
    - name: Trigger ReadTheDocs build for all versions
      run: |
        # Trigger latest (main branch)
        curl -X POST \
          -H "Authorization: Token ${{ secrets.READTHEDOCS_TOKEN }}" \
          https://readthedocs.org/api/v3/projects/flask-more-smorest/versions/latest/builds/
        
        # Trigger stable (latest tag - ReadTheDocs auto-updates this)
        curl -X POST \
          -H "Authorization: Token ${{ secrets.READTHEDOCS_TOKEN }}" \
          https://readthedocs.org/api/v3/projects/flask-more-smorest/versions/stable/builds/
    
    - name: Wait for builds to start
      run: sleep 10
    
    - name: Check build status
      run: |
        echo "ReadTheDocs builds triggered successfully"
        echo "Visit https://flask-more-smorest.readthedocs.io/en/stable/ for release docs"
        echo "Visit https://flask-more-smorest.readthedocs.io/en/latest/ for dev docs"