[tool.poetry]
name = "flask-more-smorest"
version = "0.13.1"
description = "Enhanced Flask-Smorest blueprints with automatic CRUD operations"
authors = ["Dave <david@qualisero.com>"]
maintainers = ["Dave <david@qualisero.com>"]
readme = "README.md"
homepage = "https://github.com/qualisero/flask-more-smorest"
repository = "https://github.com/qualisero/flask-more-smorest"
documentation = "https://github.com/qualisero/flask-more-smorest#readme"
keywords = ["flask", "api", "rest", "crud", "smorest", "blueprint", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Flask",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Database :: Database Engines/Servers",
]
packages = [{include = "flask_more_smorest"}]
include = [
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]
exclude = ["tests", "docs", "examples"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
flask = "^3.0.0"
sqlalchemy = "^2.0.25"
flask-smorest = "*"
flask-sqlalchemy = "^3.1.1"
marshmallow-sqlalchemy = "^1.4.2"
marshmallow = "^3.20.0"
flask-jwt-extended = "^4.6.0"
bcrypt = "^4.1.0"
werkzeug = "^3.0.0"
alembic = "^1.13.0"
inflect = ">=7.5.0,<9"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.4.1"
pytest-cov = "^6.1.1"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"

# Code Quality (ruff replaces black, isort and flake8; pyright is the type checker)
ruff = "^0.16.2"
pyright = "^1.1.408"

# Development Tools
pre-commit = "^3.6.0"
tox = "^4.11.4"

# Documentation
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
myst-parser = "^2.0.0"
sphinx-autodoc-typehints = "^2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
# addopts = "-ra -q --strict-markers --cov=flask_more_smorest --cov-report=term-missing --cov-report=html"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["flask_more_smorest"]
omit = [
    "tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

# Ruff replaces black, isort, and flake8
[tool.ruff]
line-length = 120
target-version = "py311"

# Enable formatting (black replacement)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Enable linting (flake8 + isort replacement)
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C",     # flake8-comprehensions
    "SIM",   # flake8-simplify (modern python idioms)
    "PT",    # flake8-pytest-style (better tests)
    "RET",   # flake8-return (cleaner returns)
    "RUF",   # Ruff-specific checks
    "S",     # flake8-bandit (security checks via Ruff, the only security lint)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "C408",  # unnecessary dict() call (dict() is sometimes clearer)
    "C901",  # function is too complex (some complexity is acceptable)
    "N805",  # first argument of method should be named 'self' (cls is fine for classmethods/metaclasses)
    "N806",  # variable in function should be lowercase (OK for dynamically created classes)
    "N818",  # exception name should end with Error (ApiException is fine)
    "B006",  # do not use mutable data structures for argument defaults (using list(CRUDMethod) is intentional)
    "B904",  # within except clause, use raise ... from (not always needed)
    "B017",  # pytest.raises(Exception) should be considered evil (OK in tests)
    "S101",  # Allow asserts (Ruff's S ruleset)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__
"tests/*" = [
    "S101",   # Allow asserts
    "S105",   # Allow hardcoded passwords in tests
    "S106", 
    "S107", 
    "PT009",  # Allow unittest-style assertions if needed
    "SIM117", # Allow nested context managers if clearer
    "RUF012", # ClassVar not needed in tests
]

# Configure import sorting (isort replacement)
[tool.ruff.lint.isort]
known-first-party = ["flask_more_smorest"]
force-single-line = false
split-on-trailing-comma = true

[tool.pyright]
include = ["flask_more_smorest", "tests"]
exclude = ["**/__pycache__", "**/node_modules", "**/*.egg-info"]
typeCheckingMode = "standard"
reportIncompatibleMethodOverride = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportAttributeAccessIssue = "warning"
reportMissingTypeStubs = "none"
pythonVersion = "3.11"
reportUnnecessaryTypeIgnoreComment = "error"
# Replaces mypy's disallow_untyped_defs / disallow_incomplete_defs
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportAttributeAccessIssue = "none"
reportIncompatibleMethodOverride = "none"


[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = true
envlist = py311,py312,py313,py314,lint,types

[testenv]
deps = pytest
commands = pytest {posargs}

[testenv:lint]
deps = ruff
commands = 
    ruff format --check flask_more_smorest tests
    ruff check flask_more_smorest tests

[testenv:types]
deps = pyright
commands = pyright

[testenv:coverage]
deps = 
    pytest
    pytest-cov
commands = pytest --cov=flask_more_smorest --cov-report=term-missing --cov-report=html
"""